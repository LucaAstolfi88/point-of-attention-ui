name: Deploy demos to Azure Static Web Apps

on:
  push:
    branches: [main, develop, 'feature/*']
  workflow_dispatch:

concurrency:
  group: azure-static-web-app
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and deploy demo site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Clean install dependencies to avoid Rollup optional dependency issues
        run: |
          rm -rf node_modules package-lock.json
          npm install --prefer-offline --no-audit --no-fund --legacy-peer-deps

      - name: Build libraries
        run: |
          npm run build:core
          npm -w packages/react run build
          npm -w packages/vue run build
          npm -w packages/angular run build

      - name: Build demos
        run: |
          POAUI_DEMO_BASE=/react/ npm -w demos/react run build
          POAUI_DEMO_BASE=/vue/ npm -w demos/vue run build
          npm -w demos/angular run build -- --base-href /angular/
          dotnet publish demos/blazor/BlazorDemo.csproj -c Release -o demos/blazor/publish

      - name: Assemble demo site
        run: node scripts/assemble-demo-site.mjs demo-site

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: demo-site
          api_location: ''
          output_location: ''
          skip_app_build: true
