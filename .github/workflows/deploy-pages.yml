name: Deploy demos to GitHub Pages

on:
  push:
    branches: [main, develop, 'feature/*']
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Clean install dependencies to avoid Rollup optional dependency issues
        run: |
          rm -rf node_modules package-lock.json
          npm install --prefer-offline --no-audit --no-fund --legacy-peer-deps

      - name: Build libraries
        run: |
          npm run build:core
          npm -w packages/react run build
          npm -w packages/vue run build
          npm -w packages/angular run build

      - name: Build demos
        run: |
          POAUI_DEMO_BASE=/point-of-attention-ui/react/ npm -w demos/react run build
          POAUI_DEMO_BASE=/point-of-attention-ui/vue/ npm -w demos/vue run build
          npm -w demos/angular run build -- --base-href /point-of-attention-ui/angular/
          dotnet publish demos/blazor/BlazorDemo.csproj -c Release -o demos/blazor/publish

      - name: Assemble demo site
        run: node scripts/assemble-demo-site.mjs gh-pages-output

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages-output

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
